name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout DrKLO/Telegram
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: release-11.4.2-5469
          path: Telegram
          submodules: recursive

      - name: Checkout tgwear-android-patch
        uses: actions/checkout@v4
        with:
          path: tgwear-android-patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;21.4.7075529 cmake;3.10.2'

      # 用 Python 脚本直接修改 DrKLO 文件（替代 git apply patch，更可靠）
      - name: Apply tgwear modifications
        working-directory: Telegram
        run: |
          python3 ../tgwear-android-patch/scripts/apply_modifications.py

      - name: Verify modifications
        run: |
          echo "=== gradle.properties APP_PACKAGE ==="
          grep APP_PACKAGE Telegram/gradle.properties
          echo "=== signing config ==="
          grep -E "RELEASE_STORE|RELEASE_KEY" Telegram/gradle.properties
          echo "=== keystore file ==="
          ls -la Telegram/TMessagesProj/config/release.keystore
          echo "=== AndroidManifest service ==="
          grep -A2 "WearBridgeService" Telegram/TMessagesProj/config/release/AndroidManifest.xml || echo "not found"
          echo "=== tgwear source ==="
          ls Telegram/TMessagesProj/src/main/java/org/telegram/tgwear/ || echo "not found"

      - name: Write local.properties
        working-directory: Telegram
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "APP_ID=429320" >> local.properties
          echo "APP_HASH=b6ada952313db59a2a3a89e0d9aabdc9" >> local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            Telegram/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('Telegram/TMessagesProj/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        working-directory: Telegram
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: Telegram
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon -x lintVitalRelease

      - name: List and verify APK
        run: |
          echo "=== Build outputs ==="
          find Telegram/TMessagesProj_App/build/outputs/apk -type f -name "*.apk" 2>/dev/null || \
          find Telegram -name "*.apk" -type f 2>/dev/null || echo "no apk found"
          APK=$(find Telegram -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "ERROR: no apk"; exit 1; fi
          echo "=== APK info ==="
          ls -lh "$APK"
          echo "=== APK signing info ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -20

      - name: Rename APK
        id: rename
        run: |
          APK=$(find Telegram -name "*.apk" -type f | head -1)
          VERSION=${GITHUB_REF_NAME:-dev}
          DEST="tgwear-android-${VERSION}.apk"
          cp "$APK" "$DEST"
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgwear-android-release-apk
          path: ${{ steps.rename.outputs.dest }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.dest }}
          name: TG Wear Android ${{ github.ref_name }}
          body: |
            ## TG Wear Android ${{ github.ref_name }}

            基于 [DrKLO/Telegram release-11.4.2-5469](https://github.com/DrKLO/Telegram/tree/release-11.4.2-5469) 改造的手机端配套 App。

            ### 签名信息

            - 使用 tgwear.jks 签名（与快应用端 *.pem 同源）
            - applicationId: com.hrk.tgwear

            ### 对应的快应用端

            见 [tgwear-quickapp ${{ github.ref_name }}](https://github.com/hrk666666/tgwear-quickapp/releases/tag/${{ github.ref_name }})
          draft: false
          prerelease: true
